<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 · 无形识局</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand"><span class="seal">印</span>无形识局</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav_home">首页</a></li>
        <li><a href="articles.html" class="active" data-i18n="nav_articles">文章</a></li>
        <li><a href="family.html" data-i18n="nav_family">家族</a></li>
        <li><a href="about.html" data-i18n="nav_about">关于</a></li>
        <li><button class="lang-switch" data-lang="zh" onclick="setLang('zh')">中</button></li>
        <li><button class="lang-switch" data-lang="en" onclick="setLang('en')">EN</button></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container-narrow">
      <article id="article-container">
        <!-- 动态渲染 -->
      </article>

      <!-- 评论区 -->
      <section class="comments">
        <h2 class="comments-header" data-i18n="comments_title">评论 · 共识局</h2>
        <div class="giscus-container" id="giscus-container">
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="index.html" data-i18n="nav_home">首页</a>
        <a href="articles.html" data-i18n="nav_articles">文章</a>
        <a href="family.html" data-i18n="nav_family">家族</a>
        <a href="about.html" data-i18n="nav_about">关于</a>
        <a href="https://github.com/wushu-wuxing" target="_blank" data-i18n="footer_github">GitHub</a>
      </div>
      <p><span class="seal">印</span> <span data-i18n="footer_copy">无形识局 · 大象无形</span> · <span data-i18n="footer_made">由四叶共筑</span></p>
    </div>
  </footer>

  <script src="assets/js/speech-fix.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/content.js"></script>
  <script>
    function renderArticle() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || "001";
      const article = getArticleById(id);

      const container = document.getElementById("article-container");

      if (!article) {
        container.innerHTML = '<p class="text-center" style="padding: var(--space-2xl); color: var(--text-tertiary);">文章不存在。</p>';
        return;
      }

      const data = article[currentLang];
      const catKey = "cat_" + article.category;

      document.title = `${data.title} · 无形识局`;

      // giscus mapping="og:title" 需要动态 og:title meta（每篇文章不同，评论按文章区分）
      let og = document.querySelector('meta[property="og:title"]');
      if (!og) {
        og = document.createElement('meta');
        og.setAttribute('property', 'og:title');
        document.head.appendChild(og);
      }
      og.setAttribute('content', `${data.title} · ${article.id}`);

      container.innerHTML = `
        <header class="article-header">
          <h1>${data.title}</h1>
          <div class="article-meta">
            <span>${article.id}</span>
            <span>${article.date}</span>
            <span>${t(catKey)}</span>
            <span>${article.readingMin} ${t("meta_min")}</span>
          </div>
        </header>
        <div class="article-body">
          ${data.body}
        </div>
      `;

      // 动态初始化 giscus（文章渲染后再加载，term=文章 id，每篇评论独立）
      const gc = document.getElementById("giscus-container");
      if (gc && !gc.dataset.loaded) {
        gc.dataset.loaded = "1";
        const s = document.createElement("script");
        s.src = "https://giscus.app/client.js";
        s.setAttribute("data-repo", "wushu-wuxing/wushu-wuxing.github.io");
        s.setAttribute("data-repo-id", "1288861180");
        s.setAttribute("data-category", "General");
        s.setAttribute("data-category-id", "DIC_kwDOTNJ1_M4DDL4L");
        s.setAttribute("data-mapping", "specific");
        s.setAttribute("data-term", `${article.id} · ${data.title}`);
        s.setAttribute("data-strict", "0");
        s.setAttribute("data-reactions-enabled", "1");
        s.setAttribute("data-emit-metadata", "0");
        s.setAttribute("data-input-position", "top");
        s.setAttribute("data-theme", "dark_dimmed");
        s.setAttribute("data-lang", "zh-CN");
        s.setAttribute("data-loading", "lazy");
        s.setAttribute("crossorigin", "anonymous");
        s.setAttribute("async", "");
        gc.appendChild(s);
      }
    }

    window.addEventListener("langchange", renderArticle);
    document.addEventListener("DOMContentLoaded", renderArticle);
  </script>
</body>
</html>
